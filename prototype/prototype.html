<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookSwap — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20261F;
    --paper:#FBF7EE;
    --paper-2:#F1E9D6;
    --spine:#2F4A3B;
    --spine-dark:#1E3227;
    --mustard:#D79A2C;
    --mustard-dark:#B37F1E;
    --line:#DCD2B8;
    --muted:#736C5B;
    --white:#FFFDF8;
    --danger:#A34438;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a{color:inherit; text-decoration:none;}
  button{ font-family:inherit; cursor:pointer; }

  /* ---- notice banner ---- */
  .protonote{
    background:var(--spine-dark); color:#D9D2BE; font-size:12px;
    text-align:center; padding:7px 14px; font-family:'IBM Plex Mono',monospace;
    letter-spacing:.01em;
  }

  /* ---- header ---- */
  header.site{
    background:var(--spine); color:var(--white);
    position:sticky; top:0; z-index:40;
    border-bottom:3px solid var(--spine-dark);
  }
  .header-inner{
    max-width:1120px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .logo{ font-family:'Fraunces',serif; font-weight:700; font-size:20px; color:var(--white); display:flex; align-items:center; gap:8px; cursor:pointer; }
  .logo .mark{ color:var(--mustard); }
  nav.primary{ display:flex; gap:28px; font-size:14px; font-weight:500; }
  nav.primary a{ color:#E7E1CE; padding:4px 0; border-bottom:2px solid transparent; transition:.15s; }
  nav.primary a:hover{ color:var(--white); }
  nav.primary a.active{ color:var(--white); border-bottom-color:var(--mustard); }
  .header-actions{ display:flex; align-items:center; gap:14px; }
  .icon-btn{
    background:none; border:none; color:var(--white); font-size:16px;
    position:relative; padding:4px;
  }
  .cart-count{
    position:absolute; top:-6px; right:-8px; background:var(--mustard); color:var(--spine-dark);
    font-size:10px; font-weight:700; border-radius:999px; width:16px; height:16px;
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace;
  }
  .pill-btn{
    background:var(--mustard); color:var(--spine-dark); border:none; border-radius:5px;
    padding:8px 14px; font-size:13px; font-weight:600;
  }
  .pill-btn.ghost{ background:transparent; color:var(--white); border:1.5px solid #4F6858; }
  .account-menu{ position:relative; }
  .account-trigger{ background:none; border:none; color:var(--white); font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px;}
  .dropdown{
    position:absolute; right:0; top:calc(100% + 8px); background:var(--white); color:var(--ink);
    border:1.5px solid var(--line); border-radius:8px; min-width:190px; box-shadow:0 10px 24px rgba(30,50,39,.18);
    padding:6px; display:none; z-index:60;
  }
  .dropdown.open{ display:block; }
  .dropdown a{ display:block; padding:9px 12px; font-size:13px; border-radius:5px; }
  .dropdown a:hover{ background:var(--paper-2); }
  .dropdown hr{ border:none; border-top:1px solid var(--line); margin:5px 0; }
  .hamburger{ display:none; background:none; border:none; color:var(--white); font-size:22px; }

  .mobile-nav{
    display:none; background:var(--spine-dark); padding:10px 20px 16px; flex-direction:column; gap:2px;
  }
  .mobile-nav.open{ display:flex; }
  .mobile-nav a{ color:#E7E1CE; padding:10px 4px; font-size:14px; border-bottom:1px solid #3A5545; }

  /* ---- footer ---- */
  footer.site{
    background:var(--spine-dark); color:#B9B39F; text-align:center; padding:26px 20px; font-size:12px; margin-top:40px;
  }
  footer.site a{ color:#D9D2BE; text-decoration:underline; }

  /* ---- layout helpers ---- */
  .wrap{ max-width:1120px; margin:0 auto; padding:0 24px; }
  .section{ padding:36px 24px; }
  .breadcrumb{ font-size:12px; color:var(--muted); margin-bottom:14px; font-family:'IBM Plex Mono',monospace;}
  .breadcrumb a{ color:var(--muted); }
  .breadcrumb a:hover{ color:var(--spine); }

  /* ---- hero ---- */
  .hero{ text-align:center; padding:64px 24px 50px; }
  .hero h1{ font-size:44px; line-height:1.1; max-width:640px; margin:0 auto 16px; }
  .hero h1 em{ color:var(--spine); font-style:italic; }
  .hero p{ color:var(--muted); font-size:16px; max-width:460px; margin:0 auto 26px; }
  .hero-actions{ display:flex; gap:12px; justify-content:center; }
  .btn{
    border-radius:6px; padding:12px 22px; font-size:14px; font-weight:600; border:2px solid transparent;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{ background:var(--spine); color:var(--white); }
  .btn-primary:hover{ background:var(--spine-dark); }
  .btn-outline{ background:transparent; color:var(--spine); border-color:var(--spine); }
  .btn-outline:hover{ background:var(--spine); color:var(--white); }
  .btn-danger{ background:transparent; color:var(--danger); border-color:var(--danger); }
  .btn-danger:hover{ background:var(--danger); color:var(--white); }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding:7px 12px; font-size:12px; }

  /* ---- grid & cards ---- */
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  .card{
    background:var(--white); border:1.5px solid var(--line); border-radius:10px; overflow:hidden;
    transition:.18s; display:flex; flex-direction:column;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 12px 24px rgba(32,38,31,.12); border-color:#C9BE9C; }
  .cover{
    height:150px; display:flex; align-items:flex-end; position:relative; padding:12px;
    font-family:'Fraunces',serif; color:rgba(255,255,255,.9);
  }
  .cover .initial{
    position:absolute; top:8px; right:12px; font-size:46px; font-weight:700; opacity:.28;
  }
  .cover .band{ font-size:11px; font-family:'IBM Plex Mono',monospace; letter-spacing:.04em; opacity:.85;}
  .card-body{ padding:14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card-title{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; line-height:1.25; }
  .card-author{ color:var(--muted); font-size:12.5px; }
  .card-foot{ margin-top:auto; padding-top:10px; display:flex; align-items:center; justify-content:space-between; }
  .price{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--spine); font-size:13.5px;}

  /* ---- stamp badge (signature element) ---- */
  .stamp{
    display:inline-flex; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    font-weight:600; letter-spacing:.03em; text-transform:uppercase; padding:3px 8px;
    border:1.5px dashed currentColor; border-radius:3px; transform:rotate(-2deg);
  }
  .stamp-open{ color:#3E7A4C; }
  .stamp-pending{ color:var(--mustard-dark); }
  .stamp-closed, .stamp-declined{ color:#9A9282; }
  .stamp-accepted{ color:#3E7A4C; }
  .stamp-confirmed{ color:var(--spine); }

  /* ---- forms ---- */
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:6px; padding:10px 12px; font-size:14px;
    font-family:inherit; background:var(--white); color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--spine); outline-offset:1px; border-color:var(--spine); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .upload-box{
    border:1.5px dashed var(--line); border-radius:8px; height:130px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; background:var(--paper-2); flex-direction:column; gap:4px;
  }

  .auth-card{ max-width:380px; margin:50px auto; background:var(--white); border:1.5px solid var(--line); border-radius:12px; padding:30px; }
  .auth-card h2{ font-size:24px; margin-bottom:20px; }
  .auth-switch{ text-align:center; margin-top:16px; font-size:13px; color:var(--muted); }
  .auth-switch a{ color:var(--spine); font-weight:600; text-decoration:underline; }

  /* ---- detail page ---- */
  .detail-layout{ display:flex; gap:40px; align-items:flex-start; }
  .detail-cover{ width:320px; height:420px; border-radius:10px; flex-shrink:0; }
  .detail-info{ flex:1; }
  .detail-info h1{ font-size:30px; margin-bottom:6px; }
  .detail-author{ color:var(--muted); font-size:15px; margin-bottom:16px; }
  .detail-price{ font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--spine); font-weight:600; margin-bottom:20px;}
  .detail-desc{ color:#3E4139; font-size:14.5px; line-height:1.7; margin-bottom:24px; max-width:520px; }
  .owner-row{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .avatar{ width:32px; height:32px; border-radius:50%; background:var(--paper-2); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--spine); font-family:'Fraunces',serif;}

  /* ---- list rows (cart / orders / listings / requests) ---- */
  .row-card{ background:var(--white); border:1.5px solid var(--line); border-radius:10px; padding:16px; display:flex; gap:16px; align-items:center; margin-bottom:12px; }
  .row-cover{ width:52px; height:68px; border-radius:5px; flex-shrink:0; }
  .row-title{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; }
  .row-sub{ color:var(--muted); font-size:12.5px; margin-top:2px; }
  .qty-control{ display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); border-radius:6px; padding:4px 6px;}
  .qty-control button{ background:none; border:none; font-size:15px; width:20px; color:var(--spine); font-weight:700;}
  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state .stamp{ margin-bottom:12px; }

  /* ---- summary box ---- */
  .summary-box{ background:var(--white); border:1.5px solid var(--line); border-radius:10px; padding:20px; }
  .summary-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; color:var(--muted);}
  .summary-total{ display:flex; justify-content:space-between; font-weight:700; font-size:16px; padding-top:12px; margin-top:8px; border-top:1.5px solid var(--line); color:var(--ink);}

  /* ---- dashboard ---- */
  .dash-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .dash-card{ background:var(--white); border:1.5px solid var(--line); border-radius:10px; padding:20px; transition:.15s;}
  .dash-card:hover{ border-color:var(--spine); transform:translateY(-2px); }
  .dash-card .n{ font-family:'Fraunces',serif; font-size:26px; font-weight:700; color:var(--spine); }
  .dash-card .l{ font-size:13px; color:var(--muted); margin-top:4px; }

  /* ---- toast ---- */
  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--spine-dark); color:var(--white); padding:12px 20px; border-radius:8px; font-size:13px;
    opacity:0; pointer-events:none; transition:.25s; z-index:100; display:flex; align-items:center; gap:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- 404 ---- */
  .notfound{ text-align:center; padding:100px 24px; }
  .notfound .big{ font-family:'Fraunces',serif; font-size:80px; color:var(--paper-2); -webkit-text-stroke:2px var(--line); }

  /* ---- responsive ---- */
  @media (max-width: 900px){
    nav.primary{ display:none; }
    .hamburger{ display:block; }
    .grid{ grid-template-columns:repeat(2,1fr); }
    .dash-grid{ grid-template-columns:repeat(2,1fr); }
    .detail-layout{ flex-direction:column; }
    .detail-cover{ width:100%; height:260px; }
  }
  @media (max-width: 560px){
    .grid{ grid-template-columns:1fr; }
    .dash-grid{ grid-template-columns:1fr; }
    .hero h1{ font-size:30px; }
    .hero-actions{ flex-direction:column; }
    .field-row{ flex-direction:column; gap:0; }
    .section{ padding:26px 16px; }
    .row-card{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div class="protonote">Clickable prototype — mock data only, nothing is saved or sent anywhere. "Log In" / "Register" just simulate a session.</div>

<header class="site">
  <div class="header-inner">
    <div class="logo" data-nav="home"><span class="mark">📖</span> BookSwap</div>
    <nav class="primary" id="primaryNav"></nav>
    <div class="header-actions">
      <button class="icon-btn" data-nav="cart" title="Cart">
        🛒<span class="cart-count" id="cartCount">0</span>
      </button>
      <div id="accountArea"></div>
      <button class="hamburger" id="hamburgerBtn">☰</button>
    </div>
  </div>
  <div class="mobile-nav" id="mobileNav"></div>
</header>

<div id="app"></div>

<footer class="site">
  <div>© 2026 BookSwap — built as a student project</div>
  <div style="margin-top:8px;">
    <a data-nav="home" href="#">About</a> &nbsp;·&nbsp;
    <a href="#" onclick="return false;">GitHub</a> &nbsp;·&nbsp;
    <a data-nav="notFound" href="#">404 demo</a>
  </div>
</footer>

<div id="toast"></div>

<script>
/* ===================== DATA ===================== */
const BOOKS = [
  {id:1, title:"Dune", author:"Frank Herbert", price:14.99, genre:"Sci-Fi", c1:"#3B5470", c2:"#22344A"},
  {id:2, title:"1984", author:"George Orwell", price:9.99, genre:"Classic", c1:"#7A2E2E", c2:"#4E1D1D"},
  {id:3, title:"The Hobbit", author:"J.R.R. Tolkien", price:12.50, genre:"Fantasy", c1:"#5B3A5E", c2:"#3A253C"},
  {id:4, title:"The Alchemist", author:"Paulo Coelho", price:10.00, genre:"Fiction", c1:"#8A5A2E", c2:"#5C3B1E"},
  {id:5, title:"Educated", author:"Tara Westover", price:11.25, genre:"Memoir", c1:"#2E5C5C", c2:"#1D3A3A"},
  {id:6, title:"Circe", author:"Madeline Miller", price:13.40, genre:"Fantasy", c1:"#2F4A3B", c2:"#1E3227"},
  {id:7, title:"Project Hail Mary", author:"Andy Weir", price:15.99, genre:"Sci-Fi", c1:"#6B4C9A", c2:"#432F63"},
  {id:8, title:"The Song of Achilles", author:"Madeline Miller", price:12.00, genre:"Fiction", c1:"#8A3B4E", c2:"#5C2633"},
];

let LISTINGS = [
  {id:101, title:"Sapiens", author:"Yuval Noah Harari", condition:"Good", owner:"you", ownerName:"You", wanted:"Another non-fiction, ideally history", status:"open", c1:"#2F4A3B", c2:"#1E3227"},
  {id:102, title:"Atomic Habits", author:"James Clear", condition:"Like New", owner:"you", ownerName:"You", wanted:"Any self-help or productivity title", status:"open", c1:"#8A5A2E", c2:"#5C3B1E"},
  {id:103, title:"Normal People", author:"Sally Rooney", condition:"Good", owner:"maya", ownerName:"Maya R.", wanted:"Contemporary fiction", status:"open", c1:"#7A2E2E", c2:"#4E1D1D"},
  {id:104, title:"The Silent Patient", author:"Alex Michaelides", condition:"Fair", owner:"sam", ownerName:"Sam K.", wanted:"Any thriller", status:"open", c1:"#3B5470", c2:"#22344A"},
  {id:105, title:"Klara and the Sun", author:"Kazuo Ishiguro", condition:"Like New", owner:"priya", ownerName:"Priya D.", wanted:"Literary fiction", status:"open", c1:"#5B3A5E", c2:"#3A253C"},
  {id:106, title:"Born a Crime", author:"Trevor Noah", condition:"Good", owner:"jonas", ownerName:"Jonas T.", wanted:"Memoir or biography", status:"open", c1:"#2E5C5C", c2:"#1D3A3A"},
];

let REQUESTS_INCOMING = [
  {id:1, listingId:101, requester:"Priya D.", message:"Hi! Would you take a copy of Educated in return?", status:"pending"},
  {id:2, listingId:102, requester:"Jonas T.", message:"I have Deep Work in great condition if you're interested.", status:"pending"},
];

let REQUESTS_SENT = [
  {id:1, listingTitle:"Normal People", owner:"Maya R.", status:"pending", date:"Aug 6, 2026"},
  {id:2, listingTitle:"The Silent Patient", owner:"Sam K.", status:"accepted", date:"Jul 29, 2026"},
];

let ORDERS = [
  {id:10233, date:"Jul 22, 2026", items:[{title:"1984", qty:1, price:9.99},{title:"Circe", qty:1, price:13.40}], total:23.39, status:"confirmed"},
];

const STATE = {
  page:'home',
  params:{},
  cart:[],       // {bookId, qty}
  loggedIn:false,
  userName:"Jordan",
  returnTo:null,
};

/* ===================== HELPERS ===================== */
function money(n){ return '$' + n.toFixed(2); }

function findBook(id){ return BOOKS.find(b=>b.id===Number(id)); }
function findListing(id){ return LISTINGS.find(l=>l.id===Number(id)); }

function cartCount(){ return STATE.cart.reduce((s,i)=>s+i.qty,0); }
function cartTotal(){
  return STATE.cart.reduce((s,i)=>{ const b=findBook(i.bookId); return s + (b?b.price*i.qty:0); },0);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function requireLogin(nextPage, nextParams){
  if(!STATE.loggedIn){
    STATE.returnTo = {page:nextPage, params:nextParams||{}};
    navigate('login');
    toast('Please log in to continue');
    return false;
  }
  return true;
}

function cover(c1,c2,title,band,extraStyle){
  return `<div class="cover" style="background:linear-gradient(135deg, ${c1}, ${c2}); ${extraStyle||''}">
    <span class="initial">${title.charAt(0)}</span>
    <span class="band">${band}</span>
  </div>`;
}

function stamp(status){
  const map = {
    open:['Open','stamp-open'], pending:['Pending','stamp-pending'], closed:['Closed','stamp-closed'],
    accepted:['Accepted','stamp-accepted'], declined:['Declined','stamp-declined'], confirmed:['Confirmed','stamp-confirmed']
  };
  const [label, cls] = map[status] || [status, ''];
  return `<span class="stamp ${cls}">${label}</span>`;
}

/* ===================== NAV / CHROME ===================== */
const NAV_LINKS = [
  {page:'home', label:'Home'},
  {page:'browse', label:'Browse'},
  {page:'exchange', label:'Exchange'},
];

function renderChrome(){
  const primary = document.getElementById('primaryNav');
  const mobile = document.getElementById('mobileNav');
  primary.innerHTML = NAV_LINKS.map(l=>`<a href="#" data-nav="${l.page}" class="${activeGroup()===l.page?'active':''}">${l.label}</a>`).join('');
  mobile.innerHTML = NAV_LINKS.map(l=>`<a href="#" data-nav="${l.page}">${l.label}</a>`).join('') +
    (STATE.loggedIn
      ? `<a href="#" data-nav="account">Account</a><a href="#" data-nav="home" data-logout="1">Log Out</a>`
      : `<a href="#" data-nav="login">Log In</a><a href="#" data-nav="register">Register</a>`);

  document.getElementById('cartCount').textContent = cartCount();

  const acc = document.getElementById('accountArea');
  if(STATE.loggedIn){
    acc.innerHTML = `
      <div class="account-menu">
        <button class="account-trigger" id="accTrigger">${STATE.userName} ▾</button>
        <div class="dropdown" id="accDropdown">
          <a href="#" data-nav="account">Dashboard</a>
          <a href="#" data-nav="myOrders">My Orders</a>
          <a href="#" data-nav="myListings">My Listings</a>
          <a href="#" data-nav="myRequests">My Requests</a>
          <a href="#" data-nav="profile">Profile</a>
          <hr>
          <a href="#" id="logoutLink">Log Out</a>
        </div>
      </div>`;
  } else {
    acc.innerHTML = `<button class="pill-btn ghost" data-nav="login">Log In</button>`;
  }
}

function activeGroup(){
  if(['home'].includes(STATE.page)) return 'home';
  if(['browse','bookDetail'].includes(STATE.page)) return 'browse';
  if(['exchange','listingDetail','newListing'].includes(STATE.page)) return 'exchange';
  return '';
}

/* ===================== PAGE RENDERERS ===================== */
function pageHome(){
  const featured = BOOKS.slice(0,6);
  return `
    <div class="hero">
      <h1>Buy new books. <em>Exchange</em> old ones.</h1>
      <p>A marketplace for readers — shop new titles or trade the books already on your shelf for something new to you.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" data-nav="browse">Browse Books</a>
        <a class="btn btn-outline" data-nav="exchange">List a Book</a>
      </div>
    </div>
    <div class="section wrap">
      <h2 style="font-size:20px;margin-bottom:18px;">Featured Books</h2>
      <div class="grid">${featured.map(bookCard).join('')}</div>
    </div>
  `;
}

function bookCard(b){
  return `
    <div class="card" data-nav="bookDetail" data-id="${b.id}">
      ${cover(b.c1,b.c2,b.title,b.genre)}
      <div class="card-body">
        <div class="card-title">${b.title}</div>

const PAGES = {
  home: pageHome, browse: pageBrowse, bookDetail: pageBookDetail,
  exchange: pageExchange, listingDetail: pageListingDetail, newListing: pageNewListing,
  login: pageLogin, register: pageRegister,
  cart: pageCart, checkout: pageCheckout, orderConfirm: pageOrderConfirm,
  account: pageAccount, myOrders: pageMyOrders, myListings: pageMyListings,
  incomingRequests: pageIncomingRequests, myRequests: pageMyRequests, profile: pageProfile,
  notFound: pageNotFound
};

/* ===================== ROUTER ===================== */
function navigate(page, params){
  STATE.page = page;
  STATE.params = params || {};
  document.getElementById('mobileNav').classList.remove('open');
  const dd = document.getElementById('accDropdown'); if(dd) dd.classList.remove('open');
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

function render(){
  renderChrome();
  const fn = PAGES[STATE.page] || pageNotFound;
  document.getElementById('app').innerHTML = fn();
}

/* ===================== ACTIONS ===================== */
function handleAction(action, el){
  const id = el.dataset.id;
  switch(action){
    case 'addToCart': {
      if(!requireLogin(STATE.page, STATE.params)) return;
      const existing = STATE.cart.find(i=>i.bookId===Number(id));
      if(existing) existing.qty++; else STATE.cart.push({bookId:Number(id), qty:1});
      renderChrome();
      toast('Added to cart');
      break;
    }
    case 'qtyInc': {
      const item = STATE.cart.find(i=>i.bookId===Number(id)); item.qty++;
      navigate('cart'); break;
    }
    case 'qtyDec': {
      const item = STATE.cart.find(i=>i.bookId===Number(id));
      if(item.qty>1) item.qty--; else STATE.cart = STATE.cart.filter(i=>i.bookId!==Number(id));
      navigate('cart'); break;
    }
    case 'removeFromCart': {
      STATE.cart = STATE.cart.filter(i=>i.bookId!==Number(id));
      navigate('cart'); toast('Removed from cart'); break;
    }
    case 'goCheckout': {
      if(!requireLogin('checkout')) return;
      navigate('checkout'); break;
    }
    case 'placeOrder': {
      const items = STATE.cart.map(i=>{ const b=findBook(i.bookId); return {title:b.title, qty:i.qty, price:b.price}; });
      const total = cartTotal();
      const newId = 10234 + ORDERS.length;
      ORDERS.unshift({id:newId, date:'Aug 11, 2026', items, total, status:'confirmed'});
      STATE.cart = [];
      navigate('orderConfirm', {orderId:newId});
      toast('Order placed!');
      break;
    }
    case 'viewListing': navigate('listingDetail', {id}); break;
    case 'requestExchange': {
      if(!requireLogin('listingDetail', {id})) return;
      const l = findListing(id);
      REQUESTS_SENT.unshift({id:REQUESTS_SENT.length+1, listingTitle:l.title, owner:l.ownerName, status:'pending', date:'Aug 11, 2026'});
      toast('Exchange request sent to ' + l.ownerName);
      break;
    }
    case 'newListingBtn': {
      if(!requireLogin('newListing')) return;
      navigate('newListing'); break;
    }
    case 'publishListing': {
      const title = document.getElementById('nl-title').value || 'Untitled Listing';
      const author = document.getElementById('nl-author').value || 'Unknown Author';
      const condition = document.getElementById('nl-condition').value;
      const wanted = document.getElementById('nl-wanted').value || 'Open to offers';
      const palette = [['#2F4A3B','#1E3227'],['#8A5A2E','#5C3B1E'],['#5B3A5E','#3A253C']];
      const [c1,c2] = palette[Math.floor(Math.random()*palette.length)];
      const newId = Math.max(...LISTINGS.map(l=>l.id))+1;
      LISTINGS.unshift({id:newId, title, author, condition, owner:'you', ownerName:'You', wanted, status:'open', c1, c2});
      navigate('myListings');
      toast('Listing published');
      break;
    }
    case 'acceptRequest': {
      const r = REQUESTS_INCOMING.find(r=>r.id===Number(id));
      r.status = 'accepted';
      const l = findListing(r.listingId); if(l) l.status = 'closed';
      REQUESTS_INCOMING.filter(x=>x.listingId===r.listingId && x.id!==r.id && x.status==='pending').forEach(x=>x.status='declined');
      navigate('incomingRequests', {listingId:r.listingId});
      toast('Request accepted');
      break;
    }
    case 'declineRequest': {
      const r = REQUESTS_INCOMING.find(r=>r.id===Number(id));
      r.status = 'declined';
      navigate('incomingRequests', {listingId:r.listingId});
      toast('Request declined');
      break;
    }
    case 'doLogin': {
      STATE.loggedIn = true;
      const rt = STATE.returnTo;
      STATE.returnTo = null;
      if(rt) navigate(rt.page, rt.params); else navigate('account');
      toast('Logged in as ' + STATE.userName);
      break;
    }
    case 'saveProfile': {
      const val = document.getElementById('pf-name').value;
      if(val) STATE.userName = val;
      renderChrome();
      toast('Profile saved');
      break;
    }
  }
}

/* ===================== EVENT DELEGATION ===================== */
document.addEventListener('click', function(e){
  const actionEl = e.target.closest('[data-action]');
  if(actionEl){
    e.preventDefault();
    handleAction(actionEl.dataset.action, actionEl);
    return;
  }
  const navEl = e.target.closest('[data-nav]');
  if(navEl){
    e.preventDefault();
    if(navEl.dataset.logout){ STATE.loggedIn=false; navigate('home'); toast('Logged out'); return; }
    const params = {};
    if(navEl.dataset.id) params.id = navEl.dataset.id;
    if(navEl.dataset.orderid) params.orderId = Number(navEl.dataset.orderid);
    if(navEl.dataset.listingid) params.listingId = Number(navEl.dataset.listingid);
    // guard protected pages
    const protectedPages = ['cart','checkout','account','myOrders','myListings','incomingRequests','myRequests','profile','newListing'];
    if(protectedPages.includes(navEl.dataset.nav) && !requireLogin(navEl.dataset.nav, params)) return;
    navigate(navEl.dataset.nav, params);
    return;
  }
  if(e.target.id === 'accTrigger'){
    document.getElementById('accDropdown').classList.toggle('open');
    return;
  }
  if(e.target.id === 'logoutLink'){
    e.preventDefault();
    STATE.loggedIn = false;
    navigate('home');
    toast('Logged out');
    return;
  }
  if(e.target.id === 'hamburgerBtn'){
    document.getElementById('mobileNav').classList.toggle('open');
    return;
  }
  const dd = document.getElementById('accDropdown');
  if(dd && dd.classList.contains('open') && !e.target.closest('.account-menu')){
    dd.classList.remove('open');
  }
});

/* ===================== INIT ===================== */
render();
</script>
</body>
</html>
